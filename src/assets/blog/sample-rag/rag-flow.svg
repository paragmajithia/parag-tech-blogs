<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Society document RAG demo flow</title>
  <desc id="desc">Indexing is a separate setup flow from answering questions. Documents are embedded into Chroma; browser and API questions share the same retrieval and answer flow.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18324d" flood-opacity=".10"/>
    </filter>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 11 5.5 0 11Z" fill="#168a8b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 11 5.5 0 11Z" fill="#4777b5"/>
    </marker>
    <style>
      .heading { font: 700 25px Inter, Segoe UI, Arial, sans-serif; fill: #18324d; }
      .label { font: 650 18px Inter, Segoe UI, Arial, sans-serif; fill: #18324d; }
      .small { font: 15px Inter, Segoe UI, Arial, sans-serif; fill: #52647a; }
      .step { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #fff; }
      .arrow-label { font: 650 14px Inter, Segoe UI, Arial, sans-serif; fill: #456078; }
    </style>
  </defs>

  <rect width="1400" height="920" rx="28" fill="#f5f8fc"/>
  <text x="64" y="62" class="heading">Two separate flows share one persistent index</text>
  <text x="64" y="92" class="small">Build it once for the sample documents, then query it from either the browser or the API.</text>

  <rect x="48" y="122" width="1304" height="270" rx="22" fill="#edf7f5" stroke="#b9e2da" stroke-width="2"/>
  <text x="78" y="160" class="heading">A  Build the index · before serving the app</text>

  <g filter="url(#shadow)">
    <rect x="78" y="202" width="176" height="104" rx="15" fill="#fff" stroke="#c9d6e5"/>
    <rect x="78" y="321" width="176" height="50" rx="13" fill="#fff" stroke="#c9d6e5"/>
    <rect x="313" y="237" width="195" height="100" rx="15" fill="#fff0e3" stroke="#edc69d"/>
    <rect x="565" y="237" width="195" height="100" rx="15" fill="#fff" stroke="#c9d6e5"/>
    <rect x="817" y="237" width="218" height="100" rx="15" fill="#e7f1ff" stroke="#b9cde8"/>
    <rect x="1092" y="213" width="222" height="148" rx="17" fill="#e5f5ef" stroke="#a9d8c7" stroke-width="2"/>
  </g>

  <text x="166" y="244" text-anchor="middle" class="label">AGM PDF</text>
  <text x="166" y="271" text-anchor="middle" class="small">extract text / OCR</text>
  <text x="166" y="352" text-anchor="middle" class="label">Expense workbook</text>
  <text x="410" y="278" text-anchor="middle" class="label">Extract records</text>
  <text x="410" y="306" text-anchor="middle" class="small">keep page and row details</text>
  <text x="662" y="278" text-anchor="middle" class="label">Passages + records</text>
  <text x="662" y="306" text-anchor="middle" class="small">split long text into chunks</text>
  <text x="926" y="278" text-anchor="middle" class="label">OpenAI embeddings</text>
  <text x="926" y="306" text-anchor="middle" class="small">vectors for document content</text>
  <text x="1203" y="258" text-anchor="middle" class="label">Chroma persistent store</text>
  <text x="1203" y="286" text-anchor="middle" class="small">SQLite metadata</text>
  <text x="1203" y="311" text-anchor="middle" class="small">+ vector index files</text>
  <text x="1203" y="340" text-anchor="middle" class="small">chroma_db/</text>

  <path d="M254 252h46v35h11" fill="none" stroke="#168a8b" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M254 346h35v-59h24" fill="none" stroke="#168a8b" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M508 287h52" fill="none" stroke="#168a8b" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M760 287h52" fill="none" stroke="#168a8b" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M1035 287h49" fill="none" stroke="#168a8b" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <g>
    <circle cx="278" cy="236" r="14" fill="#168a8b"/><text x="278" y="241" text-anchor="middle" class="step">A</text>
    <circle cx="535" cy="266" r="14" fill="#168a8b"/><text x="535" y="271" text-anchor="middle" class="step">B</text>
    <circle cx="787" cy="266" r="14" fill="#168a8b"/><text x="787" y="271" text-anchor="middle" class="step">C</text>
    <circle cx="1060" cy="266" r="14" fill="#168a8b"/><text x="1060" y="271" text-anchor="middle" class="step">D</text>
  </g>

  <rect x="48" y="420" width="1304" height="448" rx="22" fill="#eef3fb" stroke="#c7d6eb" stroke-width="2"/>
  <text x="78" y="461" class="heading">1–6  Ask a question · browser and API use the same endpoint</text>

  <g filter="url(#shadow)">
    <rect x="80" y="512" width="185" height="86" rx="15" fill="#fff" stroke="#c9d6e5"/>
    <rect x="80" y="686" width="185" height="86" rx="15" fill="#fff" stroke="#c9d6e5"/>
    <rect x="340" y="590" width="185" height="100" rx="15" fill="#e4efff" stroke="#b9cde8"/>
    <rect x="600" y="590" width="192" height="100" rx="15" fill="#fff" stroke="#c9d6e5"/>
    <rect x="870" y="590" width="192" height="100" rx="15" fill="#e5f5ef" stroke="#a9d8c7"/>
    <rect x="1130" y="590" width="185" height="100" rx="15" fill="#fff0e3" stroke="#edc69d"/>
  </g>

  <text x="172" y="548" text-anchor="middle" class="label">Browser chat</text>
  <text x="172" y="575" text-anchor="middle" class="small">type a question</text>
  <text x="172" y="722" text-anchor="middle" class="label">API client</text>
  <text x="172" y="749" text-anchor="middle" class="small">POST /ask</text>
  <text x="432" y="631" text-anchor="middle" class="label">FastAPI /ask</text>
  <text x="432" y="659" text-anchor="middle" class="small">one shared entry point</text>
  <text x="696" y="631" text-anchor="middle" class="label">Embed + retrieve</text>
  <text x="696" y="659" text-anchor="middle" class="small">question vector → Chroma</text>
  <text x="966" y="631" text-anchor="middle" class="label">Relevant passages</text>
  <text x="966" y="659" text-anchor="middle" class="small">with source metadata</text>
  <text x="1222" y="631" text-anchor="middle" class="label">OpenAI answer</text>
  <text x="1222" y="659" text-anchor="middle" class="small">grounded + cited</text>

  <path d="M265 555C302 555 300 610 331 620" fill="none" stroke="#4777b5" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M265 729C302 729 300 673 331 660" fill="none" stroke="#4777b5" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M525 640h66" fill="none" stroke="#4777b5" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M792 640h68" fill="none" stroke="#4777b5" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M1062 640h58" fill="none" stroke="#4777b5" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <path d="M696 580V510H1204V371" fill="none" stroke="#4777b5" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-blue)"/>
  <rect x="837" y="486" width="208" height="31" rx="15" fill="#eef3fb"/>
  <text x="941" y="507" text-anchor="middle" class="arrow-label">query vector to Chroma</text>
  <path d="M1204 361V555H1073V615" fill="none" stroke="#168a8b" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-teal)"/>
  <rect x="1081" y="526" width="191" height="28" rx="14" fill="#eef3fb"/>
  <text x="1176" y="545" text-anchor="middle" class="arrow-label">matching passages</text>

  <path d="M1222 690v82h-765v-72" fill="none" stroke="#4777b5" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="832" y="797" text-anchor="middle" class="arrow-label">answer + citations return to /ask, then to the browser or API caller</text>

  <g>
    <circle cx="300" cy="581" r="14" fill="#4777b5"/><text x="300" y="586" text-anchor="middle" class="step">1</text>
    <circle cx="558" cy="620" r="14" fill="#4777b5"/><text x="558" y="625" text-anchor="middle" class="step">2</text>
    <circle cx="824" cy="620" r="14" fill="#4777b5"/><text x="824" y="625" text-anchor="middle" class="step">3</text>
    <circle cx="1090" cy="620" r="14" fill="#4777b5"/><text x="1090" y="625" text-anchor="middle" class="step">4</text>
    <circle cx="1113" cy="719" r="14" fill="#4777b5"/><text x="1113" y="724" text-anchor="middle" class="step">5</text>
    <circle cx="472" cy="747" r="14" fill="#4777b5"/><text x="472" y="752" text-anchor="middle" class="step">6</text>
  </g>
</svg>
